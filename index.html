<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр: Системы счисления</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body {
        margin: 0; min-height: 100vh;
        background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
        display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .trainer {
        max-width: 960px; width: 100%;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border-radius: 48px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        padding: 32px 32px 40px;
        border: 1px solid rgba(255,255,255,0.7);
    }
    h1 {
        text-align: center; font-weight: 700; font-size: 2.1rem;
        color: #1e293b; margin: 0 0 8px; letter-spacing: -0.5px;
        display: flex; align-items: center; justify-content: center;
        gap: 10px; flex-wrap: wrap;
    }
    h1 span {
        background: #1e293b; color: #f8fafc; font-size: 1.5rem;
        padding: 2px 14px; border-radius: 100px;
    }
    .subhead {
        text-align: center; color: #475569; font-weight: 500;
        margin-bottom: 24px; border-bottom: 2px dashed #cbd5e1;
        padding-bottom: 16px; font-size: 1.05rem;
    }
    .stats-bar {
        display: flex; justify-content: space-between;
        background: #eef2f6; padding: 12px 20px; border-radius: 60px;
        margin-bottom: 20px; font-weight: 600; flex-wrap: wrap; gap: 8px;
    }
    .stat-item { display: flex; align-items: center; gap: 10px; color: #1e293b; }
    .stat-badge {
        background: white; padding: 6px 18px; border-radius: 40px;
        font-weight: 700; color: #0f172a;
    }
    .badge-green { color: #059669; }
    .badge-red { color: #dc2626; }

    .base-config {
        background: #ffffffd9; border-radius: 32px;
        padding: 18px 24px; margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        border: 1px solid #ffffff;
    }
    .base-config-row {
        display: flex; align-items: center; gap: 12px;
        flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
    }
    .base-config-row:last-child { margin-bottom: 0; }
    .base-label {
        font-weight: 700; color: #334155; font-size: 1rem;
        min-width: 130px; text-align: right;
    }
    .base-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .base-chip {
        background: white; border: 1.5px solid #cbd5e1;
        padding: 8px 22px; border-radius: 60px; font-weight: 600;
        cursor: pointer; transition: 0.15s; color: #1e293b;
        font-size: 0.95rem; user-select: none;
    }
    .base-chip:hover { background: #eef2f6; border-color: #94a3b8; }
    .base-chip.active { color: white; box-shadow: 0 6px 12px -6px #1e293b; }
    .base-chip.source.active { background: #1e293b; border-color: #1e293b; }
    .base-chip.target.active { background: #3b82f6; border-color: #3b82f6; box-shadow: 0 6px 12px -6px #3b82f6; }
    .base-chip.disabled { opacity: 0.35; pointer-events: none; filter: grayscale(0.5); }
    .swap-btn {
        background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: 50%;
        width: 42px; height: 42px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; font-size: 1.2rem;
        transition: 0.15s; color: #475569; flex-shrink: 0;
    }
    .swap-btn:hover { background: #e2e8f0; transform: rotate(180deg); }

    .task-area {
        background: #ffffffd9; border-radius: 36px;
        padding: 24px 24px 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        border: 1px solid #ffffff;
    }
    .question {
        font-size: 1.8rem; font-weight: 700; text-align: center;
        margin: 10px 0 20px; color: #0b1e33; padding: 10px;
        background: #f1f6fe; border-radius: 40px;
    }
    .question .from-base {
        background: #1e293b; color: white; padding: 6px 16px;
        border-radius: 60px; font-size: 1.2rem; display: inline-block;
        margin: 0 6px; vertical-align: middle;
    }
    .question .to-base {
        background: #3b82f6; color: white; padding: 6px 16px;
        border-radius: 60px; font-size: 1.2rem; display: inline-block;
        margin: 0 6px; vertical-align: middle;
    }
    .input-group {
        display: flex; flex-wrap: wrap; gap: 12px;
        justify-content: center; margin: 24px 0 16px;
    }
    .answer-input {
        flex: 2; min-width: 200px; padding: 18px 24px;
        font-size: 1.5rem; font-weight: 600;
        border: 2px solid #d1d9e6; border-radius: 100px;
        outline: none; background: #f9fcff; transition: 0.2s;
        color: #0f172a; text-align: center; letter-spacing: 1px;
        font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    .answer-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59,130,246,0.2);
        background: white;
    }
    .answer-input.correct-highlight { border-color: #10b981; background: #ecfdf5; }
    .answer-input.wrong-highlight { border-color: #ef4444; background: #fef2f2; }
    .btn {
        border: none; border-radius: 100px; padding: 18px 36px;
        font-weight: 700; font-size: 1.2rem; cursor: pointer;
        transition: 0.15s; background: #1e293b; color: white;
        box-shadow: 0 8px 18px -6px rgba(0,0,0,0.2);
        display: inline-flex; align-items: center; justify-content: center;
        gap: 8px; border: 1px solid #334155;
    }
    .btn:hover { background: #0f172a; transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
        background: #ffffff; color: #1e293b;
        border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn-hint { background: #f59e0b; border-color: #d97706; }
    .btn-hint:hover { background: #d97706; }
    .btn-next {
        background: #3b82f6; border-color: #2563eb;
        animation: pulseNext 1.5s infinite;
    }
    .btn-next:hover { background: #2563eb; animation: none; }
    @keyframes pulseNext {
        0%, 100% { box-shadow: 0 8px 18px -6px rgba(59,130,246,0.6); }
        50% { box-shadow: 0 8px 24px -2px rgba(59,130,246,0.9); }
    }
    .btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(0.3); }
    .feedback {
        min-height: 56px; font-size: 1.15rem; font-weight: 600;
        text-align: center; padding: 12px; border-radius: 28px;
        margin: 12px 0 0; display: flex; align-items: center;
        justify-content: center; gap: 12px; flex-wrap: wrap;
    }
    .feedback.correct { background: #d1fae5; color: #065f46; }
    .feedback.wrong { background: #fee2e2; color: #991b1b; }
    .feedback.info { background: #e0f2fe; color: #0369a1; }
    .hint-text {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        background: #ffffffb0; padding: 4px 14px;
        border-radius: 40px; font-size: 1.1rem;
        border: 1px solid #cbd5e1;
    }
    .bottom-actions {
        display: flex; gap: 12px; justify-content: center;
        flex-wrap: wrap; margin-top: 20px;
    }
    .small-note {
        font-size: 0.9rem; color: #64748b; text-align: center;
        margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 16px;
    }
    .hint-box {
        background: #fffbeb; border: 2px solid #fcd34d;
        border-radius: 28px; padding: 18px 22px; margin-top: 16px;
        color: #78350f; font-size: 1.05rem; line-height: 1.7;
        display: none;
    }
    .hint-box.visible { display: block; }
    .hint-box h3 {
        margin: 0 0 12px; font-size: 1.2rem;
        display: flex; align-items: center; gap: 8px; color: #92400e;
    }
    .hint-box .step {
        background: white; padding: 10px 16px; border-radius: 20px;
        margin: 8px 0; border-left: 4px solid #f59e0b;
        font-size: 1rem; word-break: break-word; color: #1e293b;
        line-height: 1.6;
    }
    .hint-box .step .label {
        font-weight: 700;
        color: #92400e; margin-right: 8px;
    }
    .hint-box .method-box {
        background: #fef3c7; padding: 12px 16px; border-radius: 20px;
        margin: 10px 0; border-left: 4px solid #f59e0b;
        color: #78350f; font-size: 1rem; line-height: 1.6;
    }
    .hint-box .method-box b { color: #92400e; }
    .hint-box .tip {
        background: #dbeafe; padding: 10px 14px; border-radius: 16px;
        margin-top: 12px; color: #1e40af; font-size: 0.98rem;
        border-left: 4px solid #3b82f6;
    }
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    @media (max-width: 700px) {
        .trainer { padding: 22px 16px; }
        h1 { font-size: 1.7rem; }
        .question { font-size: 1.4rem; }
        .btn { padding: 14px 22px; font-size: 1rem; }
        .answer-input { font-size: 1.3rem; padding: 14px 18px; }
        .base-label { min-width: auto; text-align: left; }
        .base-config-row { flex-direction: column; align-items: stretch; }
        .base-chip { padding: 7px 14px; font-size: 0.85rem; }
        .hint-box { padding: 14px 16px; font-size: 1rem; }
    }
</style>
</head>
<body>
<div class="trainer">
    <h1>🧮 Системы счисления <span>тренажёр</span></h1>
    <div class="subhead">перевод чисел между основаниями 2 – 16</div>

    <div class="stats-bar">
        <div class="stat-item">✅ Верно <span class="stat-badge badge-green" id="correctCount">0</span></div>
        <div class="stat-item">❌ Ошибок <span class="stat-badge badge-red" id="wrongCount">0</span></div>
        <div class="stat-item">📊 Всего <span class="stat-badge" id="totalCount">0</span></div>
    </div>

    <div class="base-config">
        <div class="base-config-row">
            <div class="base-label">📤 Из системы:</div>
            <div class="base-group" id="sourceGroup">
                <div class="base-chip source active" data-base="2">2</div>
                <div class="base-chip source" data-base="8">8</div>
                <div class="base-chip source" data-base="10">10</div>
                <div class="base-chip source" data-base="16">16</div>
            </div>
        </div>
        <div class="base-config-row">
            <div class="base-label">📥 В систему:</div>
            <div class="base-group" id="targetGroup">
                <div class="base-chip target" data-base="2">2</div>
                <div class="base-chip target" data-base="8">8</div>
                <div class="base-chip target active" data-base="10">10</div>
                <div class="base-chip target" data-base="16">16</div>
            </div>
            <button class="swap-btn" id="swapBtn" title="Поменять местами">⇄</button>
        </div>
    </div>

    <div class="task-area">
        <div class="question" id="questionText"></div>
        <div class="input-group">
            <input type="text" id="answerInput" class="answer-input mono" placeholder="ответ" autocomplete="off" autofocus>
            <button class="btn" id="checkBtn">Проверить</button>
        </div>
        <div class="feedback info" id="feedbackMessage">💡 Введите ответ и нажмите «Проверить»</div>

        <div class="hint-box" id="hintBox">
            <h3>📖 Как решать</h3>
            <div id="hintContent"></div>
        </div>

        <div class="bottom-actions" id="bottomActions">
            <button class="btn btn-hint" id="hintBtn">💡 Подсказка</button>
            <button class="btn btn-secondary" id="showAnswerBtn">🔍 Показать ответ</button>
            <button class="btn btn-next" id="nextBtn" style="display: none;">Дальше →</button>
            <button class="btn btn-secondary" id="newTaskBtn">🔄 Новое задание</button>
            <button class="btn btn-secondary" id="skipBtn">⏭ Пропустить</button>
            <button class="btn btn-secondary" id="resetStatsBtn">🧹 Сбросить счёт</button>
        </div>
    </div>
    <div class="small-note">🔹 Для hex используйте цифры 0-9 и буквы A-F (регистр не важен)</div>
</div>

<script>
(function() {
    // ========== СОСТОЯНИЕ ==========
    let sourceBase = 2;
    let targetBase = 10;
    let currentNumber = '1010';
    let currentCorrectAnswer = '';
    let currentDecimalValue = 10;
    let correctCount = 0;
    let wrongCount = 0;
    let hintShown = false;
    let taskResolved = false;

    // ========== DOM ==========
    const questionDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const checkBtn = document.getElementById('checkBtn');
    const feedback = document.getElementById('feedbackMessage');
    const correctSpan = document.getElementById('correctCount');
    const wrongSpan = document.getElementById('wrongCount');
    const totalSpan = document.getElementById('totalCount');
    const newTaskBtn = document.getElementById('newTaskBtn');
    const skipBtn = document.getElementById('skipBtn');
    const resetStatsBtn = document.getElementById('resetStatsBtn');
    const hintBox = document.getElementById('hintBox');
    const hintContent = document.getElementById('hintContent');
    const hintBtn = document.getElementById('hintBtn');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const nextBtn = document.getElementById('nextBtn');
    const sourceChips = document.querySelectorAll('.base-chip.source');
    const targetChips = document.querySelectorAll('.base-chip.target');
    const swapBtn = document.getElementById('swapBtn');

    // ========== УТИЛИТЫ ==========
    const DIGITS = '0123456789ABCDEF';

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function decimalToBase(decimal, base) {
        if (decimal === 0) return '0';
        let result = '';
        let num = decimal;
        while (num > 0) {
            result = DIGITS[num % base] + result;
            num = Math.floor(num / base);
        }
        return result;
    }

    function normalizeAnswer(ans) {
        return ans.trim().toUpperCase().replace(/\s+/g, '');
    }

    function updateStatsUI() {
        correctSpan.textContent = correctCount;
        wrongSpan.textContent = wrongCount;
        totalSpan.textContent = correctCount + wrongCount;
    }

    function clearInputHighlight() {
        answerInput.classList.remove('correct-highlight', 'wrong-highlight');
    }

    function hideHint() {
        hintBox.classList.remove('visible');
        hintShown = false;
    }

    function getBaseName(base) {
        return { 2: 'двоичная', 8: 'восьмеричная', 10: 'десятичная', 16: 'шестнадцатеричная' }[base] || `${base}-я`;
    }

    function updateBaseChips() {
        sourceChips.forEach(chip => {
            const base = parseInt(chip.dataset.base, 10);
            chip.classList.toggle('active', base === sourceBase);
            chip.classList.toggle('disabled', base === targetBase);
        });
        targetChips.forEach(chip => {
            const base = parseInt(chip.dataset.base, 10);
            chip.classList.toggle('active', base === targetBase);
            chip.classList.toggle('disabled', base === sourceBase);
        });
    }

    function setResolvedState(resolved) {
        taskResolved = resolved;
        if (resolved) {
            nextBtn.style.display = 'inline-flex';
            newTaskBtn.style.display = 'none';
            skipBtn.style.display = 'none';
            hintBtn.disabled = true;
            showAnswerBtn.disabled = true;
            checkBtn.disabled = true;
        } else {
            nextBtn.style.display = 'none';
            newTaskBtn.style.display = 'inline-flex';
            skipBtn.style.display = 'inline-flex';
            hintBtn.disabled = false;
            showAnswerBtn.disabled = false;
            checkBtn.disabled = false;
        }
    }

    // ========== ГЕНЕРАЦИЯ ЗАДАЧИ ==========
    function generateNewTask() {
        let maxDecimal = 255;
        if (sourceBase === 8) maxDecimal = 511;
        if (sourceBase === 16) maxDecimal = 4095;
        if (sourceBase === 10) maxDecimal = 255;

        const decimalValue = randomInt(1, maxDecimal);
        currentDecimalValue = decimalValue;
        currentNumber = decimalToBase(decimalValue, sourceBase);
        currentCorrectAnswer = decimalToBase(decimalValue, targetBase);

        questionDiv.innerHTML = `
            <span class="from-base">${sourceBase}</span> → <span class="to-base">${targetBase}</span>
            <div class="mono" style="font-size: 2.4rem; margin-top: 12px;">${currentNumber}</div>
        `;

        answerInput.value = '';
        clearInputHighlight();
        answerInput.disabled = false;
        answerInput.focus();

        feedback.className = 'feedback info';
        feedback.textContent = '✏️ Введите ответ в поле выше';

        hideHint();
        setResolvedState(false);
    }

    // ========== ПОДСКАЗКА (без ответа!) ==========
    function buildHint() {
        const fromName = getBaseName(sourceBase);
        const toName = getBaseName(targetBase);
        let html = '';

        html += `<div class="step"><span class="label">Задание:</span> перевести число <b>${currentNumber}</b> из ${fromName} системы (основание ${sourceBase}) в ${toName} (основание ${targetBase}).</div>`;

        if (targetBase === 10) {
            // Перевод в десятичную — разложение по степеням
            html += `<div class="method-box"><b>Метод решения:</b> разложение по степеням основания.</div>`;
            html += `<div class="step"><span class="label">1.</span> Запишите число как сумму произведений каждой цифры на основание в соответствующей степени.</div>`;
            html += `<div class="step"><span class="label">2.</span> Степени считаются справа налево, начиная с 0 (самая правая цифра — степень 0).</div>`;

            // Показываем шаблон с подстановкой цифр, но без вычислений
            const digits = currentNumber.toUpperCase().split('');
            const n = digits.length;
            const template = [];
            for (let i = 0; i < n; i++) {
                const digitChar = digits[i];
                const digitVal = DIGITS.indexOf(digitChar);
                const power = n - 1 - i;
                template.push(`<span style="color:#dc2626;">${digitVal}</span>·${sourceBase}<sup>${power}</sup>`);
            }
            html += `<div class="method-box" style="background:#fee2e2; border-left-color:#dc2626;">`;
            html += `<b>Подставьте свои цифры:</b><br>`;
            html += template.join(' + ');
            html += `</div>`;
            html += `<div class="tip">💡 Вычислите каждое слагаемое и сложите результаты — получите число в десятичной системе.</div>`;
        } else if (sourceBase === 10) {
            // Перевод из десятичной — деление
            html += `<div class="method-box"><b>Метод решения:</b> последовательное деление на ${targetBase} с записью остатков.</div>`;
            html += `<div class="step"><span class="label">1.</span> Делите число на <b>${targetBase}</b> нацело, записывая остаток от деления.</div>`;
            html += `<div class="step"><span class="label">2.</span> Полученное частное снова делите на <b>${targetBase}</b>, пока частное не станет равно 0.</div>`;
            html += `<div class="step"><span class="label">3.</span> Выпишите все остатки в обратном порядке (снизу вверх) — это и будет ответ.</div>`;
            html += `<div class="tip">💡 Остатки от деления дают цифры результата. Цифры больше 9 заменяются буквами: 10=A, 11=B, 12=C, 13=D, 14=E, 15=F.</div>`;
        } else {
            // Перевод между не-десятичными — через десятичную
            html += `<div class="method-box"><b>Метод решения:</b> перевод через десятичную систему (в два шага).</div>`;
            html += `<div class="step"><span class="label">Шаг 1.</span> Переведите число ${currentNumber}<sub>${sourceBase}</sub> в десятичную систему: разложите по степеням основания <b>${sourceBase}</b>.</div>`;

            const digits = currentNumber.toUpperCase().split('');
            const n = digits.length;
            const template = [];
            for (let i = 0; i < n; i++) {
                const digitChar = digits[i];
                const digitVal = DIGITS.indexOf(digitChar);
                const power = n - 1 - i;
                template.push(`<span style="color:#dc2626;">${digitVal}</span>·${sourceBase}<sup>${power}</sup>`);
            }
            html += `<div class="method-box" style="background:#fee2e2; border-left-color:#dc2626;">`;
            html += `<b>Разложение:</b><br>`;
            html += template.join(' + ');
            html += `</div>`;

            html += `<div class="step"><span class="label">Шаг 2.</span> Полученное десятичное число переведите в ${toName} систему делением на <b>${targetBase}</b> с записью остатков.</div>`;
            html += `<div class="tip">💡 Сначала вычислите сумму в шаге 1, затем делите её на ${targetBase}, пока частное не станет 0. Остатки читайте снизу вверх.</div>`;
        }

        // Добавляем напоминание, что ответ пока скрыт
        html += `<div class="step" style="background:#fef3c7; border-left-color:#f59e0b; margin-top:14px;">`;
        html += `<span class="label">ℹ️</span> Ответ не показан. Решите самостоятельно или нажмите «Показать ответ» внизу.`;
        html += `</div>`;

        return html;
    }

    function showHint() {
        hintContent.innerHTML = buildHint();
        hintBox.classList.add('visible');
        hintShown = true;
        hintBtn.disabled = true;
    }

    // ========== ПРОВЕРКА ==========
    function checkAnswer() {
        if (taskResolved) return;

        const raw = answerInput.value;
        if (!raw.trim()) {
            feedback.className = 'feedback info';
            feedback.textContent = '⚠️ Введите ответ';
            return;
        }

        const userAnswer = normalizeAnswer(raw);
        const correctAns = normalizeAnswer(currentCorrectAnswer);

        if (userAnswer === correctAns) {
            correctCount++;
            updateStatsUI();
            feedback.className = 'feedback correct';
            feedback.innerHTML = `✅ Верно! ${currentNumber}<sub>${sourceBase}</sub> = ${currentCorrectAnswer}<sub>${targetBase}</sub>`;
            answerInput.classList.add('correct-highlight');
            answerInput.classList.remove('wrong-highlight');
            answerInput.disabled = true;
            hideHint();
            setResolvedState(true);
        } else {
            wrongCount++;
            updateStatsUI();
            feedback.className = 'feedback wrong';
            feedback.innerHTML = `❌ Ошибка. Попробуйте ещё раз или посмотрите подсказку.`;
            answerInput.classList.add('wrong-highlight');
            answerInput.classList.remove('correct-highlight');

            // Показываем подсказку (только метод, без ответа)
            if (!hintShown) showHint();

            // Показываем кнопку "Дальше"
            nextBtn.style.display = 'inline-flex';
        }
    }

    function showAnswer() {
        if (!hintShown) showHint();
        feedback.className = 'feedback info';
        feedback.innerHTML = `🔍 Правильный ответ: <span class="hint-text">${currentCorrectAnswer}</span>`;
        answerInput.value = currentCorrectAnswer;
        answerInput.classList.add('correct-highlight');
        answerInput.classList.remove('wrong-highlight');
        answerInput.disabled = true;
        setResolvedState(true);
    }

    function goNext() {
        generateNewTask();
    }

    // ========== ОБРАБОТЧИКИ ==========
    sourceChips.forEach(chip => {
        chip.addEventListener('click', () => {
            const base = parseInt(chip.dataset.base, 10);
            if (base === targetBase) return;
            sourceBase = base;
            updateBaseChips();
            generateNewTask();
        });
    });

    targetChips.forEach(chip => {
        chip.addEventListener('click', () => {
            const base = parseInt(chip.dataset.base, 10);
            if (base === sourceBase) return;
            targetBase = base;
            updateBaseChips();
            generateNewTask();
        });
    });

    swapBtn.addEventListener('click', () => {
        [sourceBase, targetBase] = [targetBase, sourceBase];
        updateBaseChips();
        generateNewTask();
    });

    checkBtn.addEventListener('click', checkAnswer);

    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (!taskResolved) checkAnswer();
        }
    });

    nextBtn.addEventListener('click', goNext);
    newTaskBtn.addEventListener('click', generateNewTask);

    skipBtn.addEventListener('click', () => {
        generateNewTask();
        feedback.className = 'feedback info';
        feedback.textContent = '⏭ Задание пропущено';
    });

    resetStatsBtn.addEventListener('click', () => {
        correctCount = 0;
        wrongCount = 0;
        updateStatsUI();
        feedback.className = 'feedback info';
        feedback.textContent = '🧹 Статистика сброшена';
    });

    hintBtn.addEventListener('click', showHint);
    showAnswerBtn.addEventListener('click', showAnswer);

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    updateBaseChips();
    generateNewTask();
    answerInput.focus();
})();
</script>
</body>
</html>
